# Suivi automatique des mises à jour (audit 05/07). Les actions GitHub sont épinglées par
# EMPREINTE de commit depuis le 31/10 (commentaire `# vX.Y.Z` en bout de ligne) : Dependabot
# met à jour l'empreinte ET le commentaire, la CI gate. L'écosystème pip surveille
# pyproject.toml (versions majoritairement ouvertes → alerte sécurité au moins).
# PRs groupées le lundi pour ne pas polluer.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-minor:
        update-types: ["minor", "patch"]
