name: Scan secrets (gitleaks)

# Bloque tout secret (clé API, token, mot de passe) avant qu'il n'atteigne le dépôt PUBLIC.
# Gratuit pour les dépôts personnels/publics. Scanne le diff (PR/push) et l'historique complet.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Ajouté le 27/08, après le passage du dépôt en PRIVÉ. Sur un dépôt PUBLIC,
  # `GET /pulls/{n}/commits` sert de la donnée publique : un jeton sans ce scope
  # pouvait la lire. En PRIVÉ, la même lecture l'exige explicitement, sans quoi
  # gitleaks-action meurt sur `403 Resource not accessible by integration` — et
  # UNIQUEMENT sur l'événement `pull_request`, puisque sur un push il scanne en
  # local sans toucher à l'API. C'est exactement le motif observé : sept échecs
  # d'affilée sur les PR, `push` sur `main` resté vert tout du long.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # historique complet → détecte un secret committé puis retiré
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # requis pour scanner les pull_request (jeton auto, pas un secret perso)
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
