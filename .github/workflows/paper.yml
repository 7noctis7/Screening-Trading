name: Rebalancement paper cloud (Mac éteint, 0 €)

# Réplique le portefeuille modèle chez Alpaca PAPER — À LA DEMANDE uniquement (cf. le bloc
# `on:` ci-dessous : la planification a été retirée le 15/09 après un doublon mesuré).
# Journal (features + round-trips) persisté sur un dataset HF PRIVÉ.
#
# NE PAS réintroduire « idempotent : le second run voit des deltas ~0 et n'envoie rien ».
# Cette phrase a tenu lieu de garde-fou pendant des mois et elle est fausse : les deltas ne
# sont nuls que si les deux passages calculent la MÊME cible.
#
# SÉCURITÉ (garde-fous CLAUDE.md) :
#   - Alpaca est TOUJOURS paper (AlpacaBroker force paper=True) → aucun ordre réel possible ;
#   - QUANT_NO_CRYPTO_LIVE=1 + aucune clé Bitmart fournie → crypto 100 % neutralisée ;
#   - secrets chiffrés GitHub Actions (jamais dans le code, repo public sans clé en clair) ;
#   - sans secrets Alpaca → le run s'arrête proprement (aucun défaut dangereux).
#
# Secrets à créer (Settings → Secrets and variables → Actions) :
#   ALPACA_API_KEY / ALPACA_API_SECRET  (clés du compte PAPER Alpaca)
#   HF_TOKEN  (optionnel mais recommandé : persistance du journal sur HF privé)

# PLANIFICATION RETIRÉE LE 15/09 — mesurée, pas supposée.
#
# Ce workflow demandait 14:35 UTC. Sur les vingt derniers runs, GitHub l'a livré avec un
# retard MÉDIAN de 201 minutes, entre 28 min (#34, 19/08) et 9 h 19 (#40, 27/08 — démarré
# à 23:54 UTC, soit près de quatre heures après la clôture). En août le retard tournait
# autour de 30 min et le run tombait bien en séance ; depuis le 01/09 il s'est installé
# entre 17:44 et 19:33 UTC, c'est-à-dire DANS la fenêtre d'exécution du VPS ([18:30,
# 19:30) le 15/09). La collision n'est pas apparue : elle a dérivé jusqu'ici.
#
# Le 15/09, le run #53 (18:25:26 → 18:33:48 UTC) a ouvert treize lignes actions à 18:32:44.
# Trente-deux minutes plus tard, le passage du VPS en a soldé sept à la quantité près.
# Coût mesuré : −60,79 $ pour 74 676 $ brassés, et aucune exposition gagnée.
#
# Le commentaire d'origine de ce fichier affirmait que le doublon était sans effet :
# « si le launchd du Mac a déjà rebalancé, le second run voit des deltas ~0 et n'envoie
# rien ». C'est FAUX dès que la cible change entre les deux calculs — et elle change,
# parce que chaque passage la recalcule de zéro sur des données qui ne sont pas les mêmes
# (le runner part du cache HF, le VPS de sa propre base).
#
# Le VPS reste seul maître : il tourne 24/7, porte la base réelle, et vise DÉLIBÉRÉMENT
# l'heure avant clôture via `scripts/fenetre_execution.py`. `workflow_dispatch` est
# conservé : un lancement manuel reste possible, et `packages/execution/garde_journaliere`
# refusera de toute façon un second passage le même jour.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-live
  cancel-in-progress: false   # jamais interrompre un rebalancement en cours

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Gate secrets (sortie propre si non configuré)
        env:
          AK: ${{ secrets.ALPACA_API_KEY }}
        run: |
          if [ -z "$AK" ]; then
            echo "::warning::ALPACA_API_KEY absent — runner cloud non configuré, rien à faire."
            echo "skip=1" >> "$GITHUB_ENV"
          fi

      - name: Setup Python
        if: env.skip != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dépendances
        if: env.skip != '1'
        run: |
          python -m pip install -U pip
          pip install -e ".[data,quant,api]" -c constraints.txt

      - name: Cache OHLCV (socle HF public) + top-up prix du jour
        if: env.skip != '1'
        env:
          QUANT_PRICE_DB: ${{ github.workspace }}/data/market.db
        run: |
          python scripts/hf_cache.py pull || true
          python scripts/ingest_prices.py --daily || true

      - name: Journal ← HF privé (round-trips accumulés)
        if: env.skip != '1'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/hf_journal.py pull

      - name: Rebalancement Alpaca PAPER (réconciliation + journal)
        if: env.skip != '1'
        env:
          QUANT_PRICE_DB: ${{ github.workspace }}/data/market.db
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          QUANT_NO_CRYPTO_LIVE: "1"   # ceinture+bretelles : aucune clé Bitmart de toute façon
          QUANT_NO_LLM: "1"
          # Alertes CRITICAL hors-bande (audit 07/15 F2) : sans ces secrets, les échecs
          # d'ordre finissaient en ConsoleSink dans un log Actions que personne ne lit.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # FAIL-LOUD : run_live sort ≠ 0 si broker mort / positions illisibles → job ROUGE
        # (l'ancien run restait vert avec une clé Alpaca invalide, pour toujours).
        run: python scripts/run_live.py --live --yes

      - name: Journal + equity → HF privé (persistance, courbe du RDV 06/08)
        if: env.skip != '1' && always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/hf_journal.py push

      - name: Alerte Telegram si le run est ROUGE (fail-loud hors-bande)
        if: failure()
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG" ] && [ -n "$CHAT" ]; then
            curl -s "https://api.telegram.org/bot${TG}/sendMessage" \
              -d chat_id="$CHAT" \
              -d text="🔴 Runner paper cloud EN ÉCHEC : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
          else
            echo "::warning::Run rouge et pas de TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID — personne ne sera notifié hors GitHub."
          fi
