name: CI (tests + lint)

# Gate de robustesse (priorité #1 du projet) : la suite pytest doit rester verte sur main et à
# chaque PR. Ruff tourne en INFORMATIF (non bloquant) tant que le legacy n'est pas nettoyé
# (~3800 occurrences) → on ratchet sans bloquer le flux. Passera bloquant une fois le code propre.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Annule un run précédent si un nouveau push arrive sur la même réf (économie de minutes CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build all pages
        working-directory: apps/web
        run: npm run build

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps (lean — les tests skippent proprement les libs lourdes absentes)
        run: |
          python -m pip install -U pip
          # Set minimal mais suffisant : les tests gardent torch/vectorbt/xgboost… via importorskip.
          # weasyprint exclu (libs système cairo/pango) ; reportlab installé directement pour ses tests.
          pip install -e ".[common,data,quant,api]" -c constraints.txt reportlab scikit-learn pytest hypothesis
      - name: pytest
        run: python -m pytest -q

  tests-py313:
    # Même suite sur la version la plus récente : une incompatibilité de dépendance ou de
    # syntaxe se voit ici avant d'être découverte sur un poste qui a mis Python à jour.
    name: pytest (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps (mêmes que le job pytest)
        run: |
          python -m pip install -U pip
          pip install -e ".[common,data,quant,api]" -c constraints.txt reportlab scikit-learn pytest hypothesis
      - name: pytest
        run: python -m pytest -q

  lint:
    name: lint (ruff bugs + mypy nouvelles erreurs — bloquants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff + mypy
        # mypy ÉPINGLÉ : la référence config/mypy_baseline.json n'est valable que pour la version
        # qui l'a produite. Monter la version = régénérer la référence dans la même PR.
        run: pip install "ruff==0.17.3" "mypy==2.4.1"
      - name: ruff — vrais bugs (bloquant)
        # Erreurs de syntaxe, noms indéfinis, redéfinitions : du code qui plante à l'exécution.
        # Le 31/10, 7 noms indéfinis dont 2 plantages réels (build_preview, preset_lab).
        run: ruff check packages apps scripts tests --select E9,F63,F7,F82,F811
      - name: ruff check complet (non bloquant — style)
        continue-on-error: true
        run: ruff check packages apps scripts
      - name: mypy — aucune erreur NOUVELLE (bloquant ; référence config/mypy_baseline.json)
        # Les 2 917 erreurs du 31/10 sont figées ; une de plus fait échouer la PR.
        # Après en avoir corrigé : python scripts/mypy_baseline.py --update
        run: python scripts/mypy_baseline.py
      - name: pip-audit (vulnérabilités des dépendances — non bloquant)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off || true
      - name: vault-lint (intégrité mémoire Obsidian — non bloquant, audit 05/07)
        continue-on-error: true
        run: python scripts/vault_lint.py
