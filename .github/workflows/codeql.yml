name: CodeQL (analyse de sécurité du code)

# Gratuit pour un dépôt PUBLIC. Cherche dans Python et TypeScript les motifs exploitables
# (injection, traversée de chemin, désérialisation, secrets en clair…). Les alertes
# s'affichent dans l'onglet Security → Code scanning, sans bloquer le déploiement.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"   # chaque lundi, 03:41 UTC (créneau creux)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        with:
          category: "/language:${{ matrix.language }}"
